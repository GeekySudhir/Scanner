<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <!-- Cache busting to ensure you see changes immediately on mobile -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Payment Success</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* CSS reset & base styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #1a1a1a; color: #ffffff; height: 100vh; overflow-y: auto; overflow-x: hidden; }
        
        /* Loading Screen */
        .loading-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; background-color: #1a1a1a; position: fixed; top: 0; left: 0; z-index: 999; }
        .spinner { width: 60px; height: 60px; border: 5px solid #333; border-top: 5px solid #138808; /* Updated to India Green */ border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .processing-text { color: #ffffff; font-size: 18px; font-weight: 600; margin-bottom: 12px; }
        .secure-text { color: #888; font-size: 13px; display: flex; align-items: center; }

        /* Green Header Background */
        .success-header-bg { background-color: #1f8815; /* Updated to India Green */ height: 38vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 30px; }
        
        /* Zoom Animations */
        @keyframes zoomInOut { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        @keyframes zoomInOutGlow { 0% { transform: scale(1); box-shadow: 0 0 0px rgba(255,255,255,0); } 50% { transform: scale(1.15); box-shadow: 0 0 15px rgba(255,255,255,0.5); } 100% { transform: scale(1); box-shadow: 0 0 0px rgba(255,255,255,0); } }
        .zoom-animate { animation: zoomInOut 1.5s infinite ease-in-out; }
        .check-circle { width: 56px; height: 56px; background-color: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 16px; animation: zoomInOutGlow 1.5s infinite ease-in-out; }
        
        .success-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .success-date { font-size: 13px; opacity: 0.9; }

        /* Main Details Card */
        .success-card { background-color: #1e1e1e; margin: -50px 16px 20px 16px; border-radius: 12px; z-index: 10; position: relative; display: flex; flex-direction: column; }
        
        /* User Row */
        .user-row { display: flex; padding: 20px; gap: 16px; }
        .user-avatar { width: 50px; height: 50px; background-color: #9c27b0; border-radius: 16px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .user-avatar .material-icons { color: #ffffff; font-size: 30px; }
        .user-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .user-name { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
        .user-id { font-size: 13px; color: #888; margin-bottom: 8px; }
        .amount-row { display: flex; justify-content: space-between; align-items: center; }
        .amount-val { font-size: 22px; font-weight: 700; }
        .split-text { color: #a855f7; font-size: 13px; font-weight: 600; }

        /* Divider & Actions */
        .divider { height: 1px; background-color: #2c2c2c; width: 100%; }
        .actions-row { display: flex; padding: 15px 0; }
        .action-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: #ddd; }
        .action-btn:first-child { border-right: 1px solid #2c2c2c; }
        .action-icon { width: 36px; height: 36px; background-color: #2c1a4d; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .action-icon .material-icons { color: #a855f7; font-size: 18px; }

        /* Ad Banner Section */
        .ad-container { margin: 0 16px 30px 16px; background-color: #fff; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .ad-header { padding: 12px 16px; color: #5a4b2c; font-weight: 700; font-size: 18px; line-height: 1.2; display: flex; justify-content: space-between; }
        .ad-image-mock { width: 100%; height: 140px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?auto=format&fit=crop&w=600&q=80') center/cover; }
        .ad-footer { background-color: #3b3016; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 600; }

        /* Bottom Elements */
        .upi-footer { display: flex; justify-content: center; align-items: center; flex-direction: column; margin-bottom: 80px; opacity: 0.6; }
        .dots { display: flex; gap: 6px; margin-bottom: 12px; }
        .dot { width: 6px; height: 6px; background-color: #555; border-radius: 50%; }
        .dot.active { background-color: #fff; width: 16px; border-radius: 4px; }
        
        .done-btn { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; text-align: center; color: #a855f7; font-size: 16px; font-weight: 600; background-color: #1a1a1a; text-decoration: none; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <!-- 5 Second Loader -->
    <div id="loading-screen" class="loading-container">
        <div class="spinner"></div>
        <p class="processing-text">Processing Payment...</p>
        <p class="secure-text"><span class="material-icons" style="font-size: 14px; margin-right: 4px;">lock</span> Secure Connection</p>
    </div>

    <!-- Main Success Screen (Hidden during loading) -->
    <div id="success-screen" style="display: none;">
        
        <!-- Green Background Area -->
        <div class="success-header-bg">
            <div class="check-circle">
                <!-- Updated tick icon to India Green -->
                <span class="material-icons" style="color: #138808; font-size: 40px; font-weight: bold;">check</span>
            </div>
            <h2 class="success-title zoom-animate">Payment Successful</h2>
            <p class="success-date zoom-animate" id="date-time"></p>
        </div>

        <!-- Dynamic User Card -->
        <div class="success-card">
            <div class="user-row">
                <div class="user-avatar">
                    <span class="material-icons">person_outline</span>
                </div>
                <div class="user-info">
                    <div class="user-name" id="display-name">Loading...</div>
                    <div class="user-id">XXXXXX7036</div>
                    <div class="amount-row">
                        <span class="amount-val" id="display-amount">₹0</span>
                        <span class="split-text">Split Expense</span>
                    </div>
                </div>
            </div>
            <div class="divider"></div>
            <div class="actions-row">
                <div class="action-btn">
                    <div class="action-icon"><span class="material-icons">receipt_long</span></div>
                    <span>View Details</span>
                </div>
                <div class="action-btn">
                    <div class="action-icon"><span class="material-icons">share</span></div>
                    <span>Share Receipt</span>
                </div>
            </div>
        </div>

        <!-- Simulated Ad Banner -->
        <div class="ad-container">
            <div class="ad-header">
                <div>Kadaknath Chicken Eggs<br>Online</div>
                <div style="background:#000; padding:4px; border-radius:4px;"><span style="color:gold; font-size:12px;">KADAKNATH</span></div>
            </div>
            <div class="ad-image-mock"></div>
            <div class="ad-footer">
                <span>Open</span>
                <span class="material-icons">chevron_right</span>
            </div>
        </div>

        <!-- UPI Logo & Slider Dots -->
        <div class="upi-footer">
            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" alt="UPI" style="height: 18px; filter: grayscale(100%) brightness(200%);">
        </div>

        <div onclick="window.location.href='index.html'" class="done-btn" style="cursor: pointer;">Done</div>
    </div>
`
    <script>
        window.onload = function() {
            try {
                const amount = localStorage.getItem('payAmount') || '1';
                let name = localStorage.getItem('payName') || 'Laali jio';
                if(name.startsWith('To ')) name = name.substring(3);
                
                document.getElementById('display-amount').innerText = '₹' + amount;
                document.getElementById('display-name').innerText = name;
            } catch (e) {
                document.getElementById('display-amount').innerText = '₹1';
                document.getElementById('display-name').innerText = 'Laali jio';
            }

            const now = new Date();
            const day = now.getDate();
            const month = now.toLocaleString('en-US', { month: 'long' });
            const year = now.getFullYear();
            
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const minutes = now.getMinutes().toString().padStart(2, '0');
            
            const formattedDateTime = `${day} ${month} ${year} at ${hours}:${minutes} ${ampm}`;
            document.getElementById('date-time').innerText = formattedDateTime;

            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
            }, 5000);
        };
    </script>
</body>
</html>
